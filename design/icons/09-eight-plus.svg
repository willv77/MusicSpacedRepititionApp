<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#211425"/>
      <stop offset="1" stop-color="#07050a"/>
    </radialGradient>
    <linearGradient id="fg" gradientUnits="userSpaceOnUse" x1="110" y1="120" x2="400" y2="330">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset=".55" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <!-- "8" built from two rings so it renders identically everywhere (no font dependency) -->
    <g fill="none" stroke="url(#fg)" stroke-width="34">
      <ellipse cx="196" cy="186" rx="58" ry="52"/>
      <ellipse cx="196" cy="296" rx="70" ry="62"/>
    </g>
    <path d="M356 186V320M289 253H423" stroke="url(#fg)" stroke-width="38" stroke-linecap="round"/>
  </g>
  <g filter="url(#glow)" fill="#4ade80">
    <circle cx="156" cy="420" r="15"/>
    <circle cx="206" cy="420" r="15"/>
    <circle cx="256" cy="420" r="15"/>
    <circle cx="306" cy="420" r="15"/>
    <circle cx="356" cy="420" r="15"/>
  </g>
</svg>
